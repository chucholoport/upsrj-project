# =============================================================================
# ROS2 Jazzy Arduino Development Environment
# =============================================================================
#
# This Docker Compose configuration defines a containerized environment
# for developing robotics applications using ROS 2 Jazzy together with
# Arduino Cloud App Lab generated projects.
#
# The container is based on the official ROS2 image and mounts the
# application folders generated by Arduino App Lab into the container
# filesystem under /app.
#
# Directory mapping inside the container:
#
#   /app/python    -> Arduino Cloud Python client
#   /app/sketch    -> Arduino firmware source
#   /app/ws   -> ROS2 workspace for robotics packages
#
# This architecture keeps:
#
#   • Arduino firmware
#   • Cloud API client
#   • ROS2 robotics stack
#
# cleanly separated while allowing them to run within a unified
# development container.
#
# Author: Jesus Lopez
# Contact: https://github.com/chucholoport
# =============================================================================
services:

  ros2_arduino:

    # -------------------------------------------------------------------------
    # Build configuration
    # -------------------------------------------------------------------------
    # The container image is built from the Dockerfile located in the
    # same directory as this docker-compose.yml file.
    #
    build: .

    # Name assigned to the running container instance.
    #
    container_name: ros2_jazzy_arduino

    # -------------------------------------------------------------------------
    # Networking configuration
    # -------------------------------------------------------------------------
    # ROS2 uses DDS for communication which relies heavily on multicast.
    # Using the host network simplifies DDS discovery between nodes
    # running inside and outside the container.
    #
    network_mode: host

    # -------------------------------------------------------------------------
    # Environment variables
    # -------------------------------------------------------------------------
    # ROS_DOMAIN_ID allows isolation between different ROS networks.
    #
    # WORKSPACE defines the default ROS2 workspace location.
    #
    environment:

      - ROS_DOMAIN_ID=0
      - WORKSPACE=/app/ws

    # -------------------------------------------------------------------------
    # Volume mappings
    # -------------------------------------------------------------------------
    # These mounts expose the Arduino App Lab project directories
    # to the container runtime.
    #
    # Host directories are mapped to /app to keep a consistent and
    # predictable development environment inside the container.
    #
    volumes:

      # Arduino Cloud Python API client
      - ../../../python:/app/python

      # Arduino firmware source code
      - ../../../sketch:/app/sketch

      # ROS2 workspace for robotics packages
      - ../../../ws:/app/ws

    # -------------------------------------------------------------------------
    # Working directory
    # -------------------------------------------------------------------------
    # When attaching to the container shell, the initial directory
    # will be /app.
    #
    working_dir: /app

    # -------------------------------------------------------------------------
    # Interactive shell support
    # -------------------------------------------------------------------------
    # These options allow interactive terminal usage when attaching
    # to the container for development.
    #
    tty: true
    stdin_open: true

    # -------------------------------------------------------------------------
    # Device access
    # -------------------------------------------------------------------------
    # Expose host devices to the container. This is required for
    # interacting with Arduino boards connected via USB serial ports
    # or other hardware interfaces.
    #
    devices:
      - "/dev:/dev"
    privileged: true